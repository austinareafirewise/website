name: Check for secrets

# The pre-commit hook in .githooks/ stops a secret on the computer it was
# typed on -- but only in a checkout where somebody turned the hook on. This
# is the same check, with the same rules (.gitleaks*.toml), on everything that
# reaches GitHub, whoever pushed it. What it checks, and how it decides which
# commits are new, is in .github/scripts/secrets-scan.sh.
#
# It can't take anything back: by the time this runs, the commit is on
# GitHub. On a pull request branch it fails the check before the change
# reaches main; on main itself, it makes sure somebody finds out the same
# day. The website deploy has its own gate (deploy.yml).
#
# Push only, no pull_request trigger: every change arrives as a branch in
# this repository, a push run already shows on its pull request, and having
# both ran every check twice. Branches only, not tags.

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A newer push to the same branch makes an older scan of it moot.
    concurrency:
      group: secrets-scan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks

      - name: Scan the new commits
        env:
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: .github/scripts/secrets-scan.sh
