<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800"
     role="img" aria-labelledby="t-low">
    <title id="t-low">Today's fire danger: LOW</title>

    <!-- The gauge. Every level is drawn; the one in force is the one at full
         strength, so the sign reads at a glance and still lists the scale. -->
        <path d="M 450.0 400.0 L 150.0 400.0 A 300 300 0 0 1 207.3 223.7 Z" fill="#3f9c35" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round" />
        <path d="M 450.0 400.0 L 207.3 223.7 A 300 300 0 0 1 357.3 114.7 Z" fill="#2e9bd6" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" />
        <path d="M 450.0 400.0 L 357.3 114.7 A 300 300 0 0 1 542.7 114.7 Z" fill="#f7e017" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" />
        <path d="M 450.0 400.0 L 542.7 114.7 A 300 300 0 0 1 692.7 223.7 Z" fill="#f18a21" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" />
        <path d="M 450.0 400.0 L 692.7 223.7 A 300 300 0 0 1 750.0 400.0 Z" fill="#c8202f" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" />
    <line x1="150" y1="400" x2="750" y2="400" stroke="#1a1a1a" stroke-width="5" />
        <text x="124.7" y="294.3" transform="rotate(288.0 124.7 294.3)" text-anchor="middle" dominant-baseline="middle" font-family="Oswald, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#1a1a1a" letter-spacing="1">LOW</text>
        <text x="249.0" y="123.3" transform="rotate(324.0 249.0 123.3)" text-anchor="middle" dominant-baseline="middle" font-family="Oswald, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#1a1a1a" letter-spacing="1">MODERATE</text>
        <text x="450.0" y="58.0" transform="rotate(360.0 450.0 58.0)" text-anchor="middle" dominant-baseline="middle" font-family="Oswald, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#1a1a1a" letter-spacing="1">HIGH</text>
        <text x="651.0" y="123.3" transform="rotate(396.0 651.0 123.3)" text-anchor="middle" dominant-baseline="middle" font-family="Oswald, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#1a1a1a" letter-spacing="1">VERY HIGH</text>
        <text x="775.3" y="294.3" transform="rotate(432.0 775.3 294.3)" text-anchor="middle" dominant-baseline="middle" font-family="Oswald, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#1a1a1a" letter-spacing="1">EXTREME</text>

    <!-- The pointer. The same yellow-to-ember on every sign: it is one object
         that moves, not five that change color, and the wedge it lands on is
         what says the level. Fire comes up out of the middle underneath it. -->
    <defs>
        <linearGradient id="arrow-low" gradientUnits="userSpaceOnUse"
                        x1="450" y1="116" x2="450" y2="400">
            <stop offset="0" stop-color="#ffd83a" />
            <stop offset="0.45" stop-color="#f9c01b" />
            <stop offset="0.78" stop-color="#ef7d19" />
            <stop offset="1" stop-color="#d0341c" />
        </linearGradient>
        <!-- The pointer is cut off at the baseline. Turned far enough, the
             corner at the foot of the shaft swings below the line and shows
             as a nick under it; this is the one shape that has to stop
             exactly where the gauge does.

             The clip sits on a group outside the rotation. On the rotating
             group itself it turns with the arrow, which clips the wrong half
             and leaves the nick exactly where it was. -->
        <clipPath id="gauge-low">
            <rect x="0" y="0" width="900" height="400" />
        </clipPath>
    </defs>
    <g clip-path="url(#gauge-low)">
    <g transform="rotate(-72.0 450 400)">
        <path d="M 450 116
                 L 508 212
                 L 474 212
                 L 474 400
                 L 426 400
                 L 426 212
                 L 392 212 Z"
              fill="url(#arrow-low)" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" />
    </g>
    </g>
        <path transform="translate(450 400) scale(0.95)" d="M -75 0 C -79 -44 -54 -63 -45 -97 C -41 -71 -31 -59 -19 -53 C -15 -85 -5 -113 6 -136 C 16 -109 25 -87 33 -63 C 44 -73 57 -67 63 -43 C 70 -29 74 -15 75 0 Z" fill="#d0341c" />
        <path transform="translate(456 400) scale(0.68)" d="M -75 0 C -79 -44 -54 -63 -45 -97 C -41 -71 -31 -59 -19 -53 C -15 -85 -5 -113 6 -136 C 16 -109 25 -87 33 -63 C 44 -73 57 -67 63 -43 C 70 -29 74 -15 75 0 Z" fill="#ef7d19" />
        <path transform="translate(445 400) scale(0.44)" d="M -75 0 C -79 -44 -54 -63 -45 -97 C -41 -71 -31 -59 -19 -53 C -15 -85 -5 -113 6 -136 C 16 -109 25 -87 33 -63 C 44 -73 57 -67 63 -43 C 70 -29 74 -15 75 0 Z" fill="#f9c01b" />
        <path transform="translate(453 400) scale(0.23)" d="M -75 0 C -79 -44 -54 -63 -45 -97 C -41 -71 -31 -59 -19 -53 C -15 -85 -5 -113 6 -136 C 16 -109 25 -87 33 -63 C 44 -73 57 -67 63 -43 C 70 -29 74 -15 75 0 Z" fill="#ffe884" />

    <!-- The word, which is what somebody actually reads -->
    <rect x="154" y="432" width="592" height="132" rx="8"
          fill="#3f9c35" stroke="#1a1a1a" stroke-width="5" />
    <text x="450" y="502" text-anchor="middle" dominant-baseline="middle"
          font-family="Oswald, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="700" fill="#ffffff"
          stroke="#1a1a1a" stroke-width="4"
          paint-order="stroke" letter-spacing="2">LOW</text>

    <text x="450" y="656" text-anchor="middle" font-family="Oswald, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
          font-size="84" font-weight="700" fill="#8f1d1d" stroke="none" stroke-width="0"
          stroke-linejoin="round" paint-order="stroke" letter-spacing="2">TODAY&#8217;S FIRE</text>
    <text x="450" y="744" text-anchor="middle" font-family="Oswald, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
          font-size="84" font-weight="700" fill="#8f1d1d" stroke="none" stroke-width="0"
          stroke-linejoin="round" paint-order="stroke" letter-spacing="2">DANGER</text>
</svg>
